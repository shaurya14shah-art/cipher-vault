<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enclave WebDrop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        :root {
            --surface: #131315;
            --surface-bright: #39393b;
            --on-surface: #e5e1e4;
            --outline: #8e9192;
            --outline-variant: #444748;
            --primary: #ffffff;
            --error: #ffb4ab;
        }
        body {
            background-color: var(--surface);
            color: var(--on-surface);
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
        }
        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border: 1px solid var(--outline-variant);
            background: #1c1b1d;
        }
        .header {
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
            color: var(--outline);
            margin-bottom: 24px;
            text-align: center;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 12px;
            background: var(--surface);
            border: 1px solid var(--outline-variant);
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 16px;
            text-align: center;
            letter-spacing: 4px;
            margin-bottom: 16px;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: var(--outline);
        }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #131315;
            border: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover {
            background: #e2e2e2;
        }
        .status {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            text-align: center;
            margin-top: 16px;
            color: var(--outline);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">SECURE TRANSFER</div>
        <div id="meta" class="status" style="margin-bottom: 16px; color: var(--primary)">Connecting to Enclave...</div>
        
        <input type="text" id="pin" placeholder="ENTER 6-DIGIT PIN" maxlength="6" disabled autocomplete="off" />
        <button id="btn" disabled onclick="downloadAndDecrypt()">DECRYPT & DOWNLOAD</button>

        <div id="status" class="status"></div>
    </div>

    <script>
        let targetFilename = "secure_payload";

        // Fetch metadata on load
        fetch('/meta')
            .then(r => r.json())
            .then(data => {
                targetFilename = data.filename;
                document.getElementById('meta').innerText = "Incoming Payload: " + targetFilename;
                document.getElementById('pin').disabled = false;
                document.getElementById('btn').disabled = false;
            })
            .catch(e => {
                document.getElementById('meta').innerText = "Connection lost.";
            });

        async function downloadAndDecrypt() {
            const status = document.getElementById('status');
            
            try {
                status.innerText = "Processing...";
                status.style.color = "var(--outline)";

                // Get PIN and strip ALL whitespace (spaces, tabs, etc)
                const pin = document.getElementById('pin').value.replace(/\s+/g, '');
                if (pin.length !== 6) {
                    throw new Error("PIN must be exactly 6 digits.");
                }

                // 1. Fetch encrypted bytes
                const response = await fetch('/payload');
                if (!response.ok) throw new Error("Payload not found on server");
                const encryptedBuffer = await response.arrayBuffer();

                status.innerText = "Deriving key from PIN...";

                // 2. Derive key (SHA-256 of PIN)
                const pinBytes = new TextEncoder().encode(pin);
                const hashBuffer = await crypto.subtle.digest('SHA-256', pinBytes);
                
                const key = await crypto.subtle.importKey(
                    "raw",
                    hashBuffer,
                    "AES-GCM",
                    false,
                    ["decrypt"]
                );

                status.innerText = "Decrypting payload...";

                // 3. Split nonce and ciphertext
                const encryptedArray = new Uint8Array(encryptedBuffer);
                const nonce = encryptedArray.slice(0, 12);
                const ciphertext = encryptedArray.slice(12);

                // 4. Decrypt
                const decryptedBuffer = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: nonce },
                    key,
                    ciphertext
                );

                status.innerText = "Decryption successful. Choose how to save.";
                status.style.color = "var(--primary)";

                // HARDWARE KEY DECRYPTION FOR RAW FILE
                const masterKeyString = "ciphervault_hardware_key_32bytes";
                const masterKeyBytes = new TextEncoder().encode(masterKeyString);
                const masterKey = await crypto.subtle.importKey(
                    "raw", masterKeyBytes, "AES-GCM", false, ["decrypt"]
                );
                
                const cvaultArray = new Uint8Array(decryptedBuffer);
                const masterNonce = cvaultArray.slice(0, 12);
                const masterCiphertext = cvaultArray.slice(12);
                
                const rawBuffer = await crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: masterNonce },
                    masterKey,
                    masterCiphertext
                );
                
                const rawArray = new Uint8Array(rawBuffer);
                let actualFileArray = rawArray;
                if (rawArray.length >= 5 && rawArray[0] === 67 && rawArray[1] === 86 && rawArray[2] === 76 && rawArray[3] === 84) {
                    actualFileArray = rawArray.slice(5);
                }

                // 5. Create Blob URLs
                const blobCvault = new Blob([decryptedBuffer], { type: "application/octet-stream" });
                const urlCvault = window.URL.createObjectURL(blobCvault);
                
                const blobRaw = new Blob([actualFileArray], { type: "application/octet-stream" });
                const urlRaw = window.URL.createObjectURL(blobRaw);
                
                // Transform the button into download links
                const btn = document.getElementById('btn');
                const rawFilename = targetFilename.replace(".cvault", "");
                
                btn.outerHTML = '<div style="display: flex; flex-direction: column; gap: 12px;">' +
                    '<a href="' + urlCvault + '" download="' + targetFilename + '" style="display: block; width: 100%; padding: 12px; background: #39393b; color: #ffffff; border: 1px solid #444748; font-family: \'JetBrains Mono\', monospace; font-weight: bold; cursor: pointer; text-transform: uppercase; text-align: center; text-decoration: none; box-sizing: border-box; font-size: 14px;">SAVE TO VAULT (.CVAULT)</a>' +
                    '<a href="' + urlRaw + '" download="' + rawFilename + '" style="display: block; width: 100%; padding: 12px; background: #ffffff; color: #131315; border: none; font-family: \'JetBrains Mono\', monospace; font-weight: bold; cursor: pointer; text-transform: uppercase; text-align: center; text-decoration: none; box-sizing: border-box; font-size: 14px;">OPEN RAW FILE</a>' +
                    '</div>';
                
            } catch (err) {
                console.error(err);
                status.innerText = "DECRYPTION FAILED. Incorrect PIN.";
                status.style.color = "var(--error)";
            }
        }
    </script>
</body>
</html>
